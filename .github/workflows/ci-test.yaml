name: Arduino CI (test fast)
on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - name: Setup cores & libs
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          # (ทางเลือก) ปักเวอร์ชันไลบรารีที่ใช้จริง
          # arduino-cli lib install "Sensirion I2C SEN6x@1.0.3" "Adafruit MAX1704X@1.3.0"
      - name: Compile dev sketches only
        shell: bash
        run: |
          set -e
          shopt -s globstar nullglob
          # dev apps
          for ino in firmware/apps/**/dev/**/**.ino; do
            echo "Compiling $ino"
            arduino-cli compile --fqbn esp32:esp32:esp32c6 "$(dirname "$ino")"
          done
          # module examples
          for ino in firmware/modules/**/examples/**/**.ino; do
            echo "Compiling $ino"
            arduino-cli compile --fqbn esp32:esp32:esp32c6 "$(dirname "$ino")"
          done
